# Questions for keys this chart sets that the registry chart's form does not ask.
# Appended verbatim to the generated questions.yaml at package time by
# openg2p/packaging ci/chart/inherit-questions.sh, AFTER the questions inherited
# from openg2p-registry (images, hostnames, DB seed, ...) — so this file is a bare
# list of questions, NOT a `questions:` document: a second top-level `questions:`
# key would replace every inherited question. Variables here address the ROOT
# chart and are NOT path-prefixed.

# Env values must reach Kubernetes as strings, hence an enum of "true"/"false"
# rather than a boolean.
- variable: registry.celeryWorker.envVars.REGISTRY_CELERY_WORKERS_ACTIVITY_ODK_ENABLED
  label: "Pull submissions from ODK Central"
  description: >-
    Pull crop-sowing form submissions from the ODK Central installed with
    commons-services into the activity register. Also activate the form in the
    register's Settings (ODK project and form ID) and create the ODK credentials
    Secret.
  type: enum
  options:
    - "false"
    - "true"
  default: "false"
  group: "Crop Sown Registry"

# Sample data is two switches: registry.dbSeed.loadSampleData (inherited "Load
# Sample Data" question: the sample clusters) and this one (the sample crop
# seasons, recorded by the Celery worker). Both are off by default. Crop seasons
# are only recorded once the sample clusters exist, so this one alone loads
# nothing.
- variable: registry.celeryWorker.envVars.REGISTRY_CELERY_WORKERS_ACTIVITY_LOAD_SAMPLE_DATA
  label: "Load sample crop seasons"
  description: >-
    Record sample crop seasons (plans, sowings, observations, harvests) for
    Master Data's sample people, once, after install. Needs "Load Sample Data"
    (the sample clusters) and Master Data's country samples. Leave off for
    production. If any sample cannot be loaded, the install fails (see the
    activity-samples Job's log).
  type: enum
  options:
    - "false"
    - "true"
  default: "false"
  group: "Crop Sown Registry"
  show_if: "registry.dbSeed.loadSampleData=true"
