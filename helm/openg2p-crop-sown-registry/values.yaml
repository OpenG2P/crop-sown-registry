# Crop Sown Registry — values overlay for the openg2p-registry chart.
#
#     helm repo add openg2p https://openg2p.github.io/openg2p-helm
#     helm dependency build ./helm/openg2p-crop-sown-registry
#     helm -n <ns> install csr ./helm/openg2p-crop-sown-registry
#
# global.* propagates to the subchart; registry.* configures the subchart itself.
# Everything not set here is inherited from openg2p-registry.

global:
  baseDomain: '{{ .Release.Namespace }}.openg2p.org'
  registryVariant: 'crop-sown-registry'
  registryHostname: '{{ .Release.Name }}.{{ tpl .Values.global.baseDomain $ }}'

  # Object store: the in-cluster commons Garage (S3-compatible; replaced MinIO).
  # Same as the openg2p-registry subchart default; set here too so this chart
  # works on subchart versions that still default to the old MinIO host.
  minioHost: 'commons-garage:3900'
  minioSecure: false

  postgresqlHost: commons-postgresql
  registryDB: '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  registryDBPort: 5432
  registryDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  registryDBSecret: '{{ .Release.Name }}'
  registryDBUserPasswordKey: '{{ .Release.Name }}-db-user'
  # No Master Data database settings: the registry reads Master Data through its
  # API (the subchart's global.masterDataReadMode 'api'), and seeding never
  # touches MDS's database. The subchart keeps masterDataDB* defaults for its 'db'
  # rollback mode only.

registry:
  # Crop-sown images, each FROM the matching openg2p-registry base image. CI
  # rewrites these tags to the freshly built version.
  staffApi:
    image:
      repository: openg2p/openg2p-crop-sown-registry-staff-api
      tag: 0.0.0-develop
  partnerApi:
    image:
      repository: openg2p/openg2p-crop-sown-registry-partner-api
      tag: 0.0.0-develop
  celeryWorker:
    image:
      repository: openg2p/openg2p-crop-sown-registry-celery
      tag: 0.0.0-develop
    # Helm merges maps, so these add to the subchart's worker env.
    envVars:
      # ODK Central in the same namespace (commons-services). Credentials come
      # from a Secret the operator creates; see docs/deployment.md.
      REGISTRY_CELERY_WORKERS_ACTIVITY_ODK_ENABLED: "false"
      REGISTRY_CELERY_WORKERS_ACTIVITY_ODK_BASE_URL: "http://commons-services-odk-central-backend"
      # Sample crop seasons for Master Data's sample people, recorded once through
      # the activity write path. Off by default; for a demo, turn it on together
      # with dbSeed.loadSampleData (the samples wait for the sample clusters).
      REGISTRY_CELERY_WORKERS_ACTIVITY_LOAD_SAMPLE_DATA: "false"
  celeryBeat:
    image:
      repository: openg2p/openg2p-crop-sown-registry-celery
      tag: 0.0.0-develop
  dbSeed:
    image:
      repository: openg2p/openg2p-crop-sown-registry-db-seed
      tag: 0.0.0-develop
    # Off by default. When on, loads the two sample clusters
    # (docker/db-seed/load_sample_data.py) as approved Cluster records. Sample
    # crop-season activities are not loaded here: the platform's Celery sample
    # task creates them through the APIs (celeryWorker.envVars above).
    loadSampleData: false
    loadImages: false
    loadTemplates: true
    # Code lists are NOT seeded or copied into this registry: activity reference
    # checks read every list (crop, season, seed, fertiliser, pest, ...) live
    # from Master Data. They are the ETH pack's agriculture domain, loaded by the
    # master-data chart with geoSeed.domains: [agriculture] — set there, not
    # here. Without it every activity is rejected on its crop code.
    # The sample clusters' geo hierarchy is read through Master Data's API
    # (MDS_* env from the subchart's db-seed Job), and the Cluster form's location
    # widget takes the country's geo levels from Master Data at runtime.

  iamRegister:
    applicationDescription: "Crop Sown Registry"

  # The Crop Sown Registry issues no functional IDs: CropSown is an activity
  # register, and a Cluster's code is entered by staff. So no ID generator.
  idgenerator:
    enabled: false

  # The platform's sanity suite, from its own image: the smoke tier (partner API
  # live, DCI search route served) runs on every install/upgrade and needs
  # nothing else. Its e2e tier seeds and searches a record-register record, which
  # this registry does not have, so it stays off. Activity-register checks run
  # against a deployed instance with scripts/e2e_smoke.py.
  sanity:
    enabled: true
    runE2e: false

  # AWE (cluster change requests and intake forms): nothing to set. The
  # openg2p-registry chart enables it by default (global.aweEnabled: true) and,
  # as for the Farmer Registry, points at the shared AWE in commons-services;
  # db-seed then runs awe_meta_data/ (the Cluster policies and this release's
  # callback secret) against the shared AWE database, and keycloak-init creates
  # the approvers alex.carter / nina.patel the policies name.
